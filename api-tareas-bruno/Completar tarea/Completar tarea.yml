info:
  name: Completar tarea
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/tareas/{{completarId}}/completar"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("responde JSON", function () {
          expect(res.getHeader("content-type")).to.include("application/json");
        });

        test("devuelve la tarea con sus campos", function () {
          const tarea = res.getBody();
          expect(tarea.id).to.be.a("number");
          expect(tarea.titulo).to.equal("Sacar la basura");
          expect(tarea.descripcion).to.equal("Antes de las 9");
          expect(tarea.estado).to.equal("completada");
        });

        test("es la tarea pedida", function () {
          expect(res.getBody().id).to.equal(bru.getVar("completarId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
