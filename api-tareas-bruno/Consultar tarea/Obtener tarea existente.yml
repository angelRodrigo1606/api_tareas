info:
  name: Obtener tarea existente
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/tareas/{{consultarId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("responde JSON", function () {
          expect(res.getHeader("content-type")).to.include("application/json");
        });

        test("devuelve la tarea con sus campos", function () {
          const tarea = res.getBody();
          expect(tarea.id).to.be.a("number");
          expect(tarea.titulo).to.equal("Leer");
          expect(tarea.descripcion).to.equal("Capítulo 3");
          expect(tarea.estado).to.equal("pendiente");
        });

        test("es la tarea pedida", function () {
          expect(res.getBody().id).to.equal(bru.getVar("consultarId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
