http:
  method: POST
  url: "{{baseUrl}}/tareas"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "titulo": "se sustituye en el script previo"
      }
  auth: inherit

runtime:
