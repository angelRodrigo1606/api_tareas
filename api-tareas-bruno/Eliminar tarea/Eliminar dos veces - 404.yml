info:
  name: Eliminar dos veces - 404
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseUrl}}/tareas/{{eliminarId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 404", function () {
          expect(res.getStatus()).to.equal(404);
        });

        test("el error es application/problem+json", function () {
          expect(res.getHeader("content-type")).to.include("application/problem+json");
        });

        test("el cuerpo describe el error", function () {
          const id = bru.getVar("eliminarId");
          const error = res.getBody();
          expect(error.status).to.equal(404);
          expect(error.title).to.equal("Tarea no encontrada");
          expect(error.detail).to.equal("No existe ninguna tarea con id " + id);
          expect(error.id).to.equal(id);
          expect(error.instance).to.equal("/tareas/" + id);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
