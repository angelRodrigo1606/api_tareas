info:
  name: Filtrar completadas
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/tareas?estado=completada"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("todas las tareas están completadas", function () {
          res.getBody().forEach(function (t) { expect(t.estado).to.equal("completada"); });
        });

        test("incluye la completada y no la pendiente", function () {
          const ids = res.getBody().map(function (t) { return t.id; });
          expect(ids).to.include(bru.getVar("completadaId"));
          expect(ids).to.not.include(bru.getVar("pendienteId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
