info:
  name: Listar todas
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/tareas"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("responde JSON", function () {
          expect(res.getHeader("content-type")).to.include("application/json");
        });

        test("devuelve una lista", function () {
          expect(res.getBody()).to.be.an("array");
        });

        test("incluye tareas pendientes y completadas", function () {
          const ids = res.getBody().map(function (t) { return t.id; });
          expect(ids).to.include(bru.getVar("pendienteId"));
          expect(ids).to.include(bru.getVar("completadaId"));
        });

        test("está ordenada por id", function () {
          const ids = res.getBody().map(function (t) { return t.id; });
          const ordenados = ids.slice().sort(function (a, b) { return a - b; });
          expect(ids).to.deep.equal(ordenados);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
