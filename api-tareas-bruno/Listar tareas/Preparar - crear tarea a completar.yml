info:
  name: Preparar - crear tarea a completar
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/tareas"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "titulo": "Tarea completada"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("completadaId", res.getBody().id);
    - type: tests
      code: |-
        test("responde 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Prepara los datos: crea una tarea y guarda su id en la variable `completadaId`."
