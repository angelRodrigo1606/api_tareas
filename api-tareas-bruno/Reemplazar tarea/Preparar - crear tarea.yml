info:
  name: Preparar - crear tarea
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/tareas"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "titulo": "Leer",
        "descripcion": "Capítulo 3"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("reemplazarId", res.getBody().id);
    - type: tests
      code: |-
        test("responde 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Prepara los datos: crea una tarea y guarda su id en la variable `reemplazarId`."
