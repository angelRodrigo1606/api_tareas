opencollection: 1.0.0

info:
  name: api-tareas-bruno
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: baseUrl
      value: http://localhost:8080

docs:
  content: API de tareas. `baseUrl` está definida como variable de colección (http://localhost:8080); el entorno `local` puede sobrescribirla.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
